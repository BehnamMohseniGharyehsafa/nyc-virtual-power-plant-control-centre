name: Numerical and software validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,hosting]"
      - run: python -m pytest
      - name: Validate production WSGI entry point
        run: gunicorn --check-config --config gunicorn.conf.py app.wsgi:server
        env:
          VPP_RESULTS_DIR: ${{ runner.temp }}/vpp-production-smoke
