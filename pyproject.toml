[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-virtual-power-plant-control-centre"
version = "0.1.0"
description = "A reproducible Python laboratory for network-constrained urban DER coordination"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "numpy>=2.2,<2.5", "pandas>=2.3,<2.4", "scipy>=1.15,<1.18",
  "cvxpy>=1.7,<2", "highspy>=1.11,<2", "clarabel>=0.11,<0.12",
  "pandapower==3.5.6", "pvlib==0.15.2", "networkx>=3.6,<3.7",
  "shapely>=2.1,<3", "pyproj>=3.7,<4", "pyarrow>=20,<25",
  "dash==3.4.0", "dash-bootstrap-components==2.0.4", "plotly>=6.3,<7",
  "pydantic>=1.10,<3", "requests>=2.32,<3", "numpy-financial==1.0.0",
  "matplotlib>=3.10,<4", "orjson>=3.10,<4", "tzdata>=2025.2"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]
hosting = ["gunicorn>=26.2,<27; sys_platform != 'win32'"]

[tool.setuptools.packages.find]
include = ["app*", "core*", "models*", "optimisation*", "controllers*", "economics*", "flexibility*", "visualisation*", "data*", "experiments*"]

[tool.setuptools.package-data]
app = ["assets/*", "static/city/*", "static/vendor/*", "static/vendor/addons/*/*.js"]
data = ["cache/*.json", "cache/*.csv", "cache/*.geojson", "demo/community/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
